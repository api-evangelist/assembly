name: Assembly
description: 'Assembly (joinassembly.com, by Quantum Workplace) is an employee recognition,
  rewards, and engagement platform that helps organizations celebrate achievements, run
  peer-to-peer recognition, milestone and anniversary celebrations, custom awards, challenges,
  and an integrated rewards catalog to build company culture. Assembly connects to the
  HR and communications stack through 80+ prebuilt integrations (Slack, Microsoft Teams,
  BambooHR, Workday, ADP, Rippling, Okta, Google Workspace, and more). Assembly does not
  publish a self-service developer REST API; integration is via its prebuilt connector
  catalog. It was surfaced in the API Evangelist network as a portfolio company of Homebrew,
  Union Square Ventures, and Y Combinator.'
